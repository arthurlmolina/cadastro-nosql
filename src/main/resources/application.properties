spring.application.name=cadastro

# Spring Boot 4: propriedades do MongoDB usam o prefixo spring.mongodb.*
# A URI vem da variável de ambiente MONGODB_URI (nunca versionar credenciais).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cadastro_aep}

management.endpoints.web.exposure.include=health,info

# Porta da aplicação (a 8080 costuma estar ocupada por outros programas)
server.port=8081
